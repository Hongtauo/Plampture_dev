# Plampture 项目 - isort 导入排序配置

[settings]
# 使用 black 兼容的配置
profile = black
line_length = 120

# 导入分组
import_heading_stdlib = 标准库
import_heading_thirdparty = 第三方库
import_heading_firstparty = 项目模块
import_heading_localfolder = 本地模块

# 已知的第三方库
known_third_party = 
    cv2,
    numpy,
    PySide6,
    loguru,
    pyzbar,
    pygrabber

# 已知的第一方库 (项目自己的模块)
known_first_party = 
    Plampture_ui,
    Setup_ui,
    camera_manager,
    capture,
    dynamic_layout,
    export,
    plam_ROI_worker,
    ROI,
    scan_QRcode,
    setup,
    snapshot_io

# 排除的文件
skip = 
    .git,
    __pycache__,
    .vscode,
    workspace,
    build,
    dist,
    *.egg-info,
    .pytest_cache,
    .mypy_cache,
    Plampture_ui.py,
    Setup_ui.py

# 多行导入模式
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

# 其他选项
force_single_line = False
force_sort_within_sections = False
